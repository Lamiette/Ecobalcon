<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Terreau humide en hiver : trois vérifications</title>
  <desc id="desc">Vérifier le terreau sous la surface, vider l’eau dans le cache-pot et garder les trous d’évacuation libres.</desc>
  <rect width="1200" height="675" fill="#edf4f1"/>
  <rect x="40" y="40" width="1120" height="530" rx="28" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#204d3d">
    <text x="90" y="115" font-size="40" font-weight="700">Avant d’arroser, regarde sous le pot</text>
    <text x="90" y="160" font-size="25" fill="#557065">Un mélange frais et un contenant plein d’eau ne demandent pas le même geste.</text>
    <rect x="90" y="216" width="320" height="324" rx="20" fill="#f2f6ee"/>
    <rect x="440" y="216" width="320" height="324" rx="20" fill="#edf5f7"/>
    <rect x="790" y="216" width="320" height="324" rx="20" fill="#f2f6ee"/>
    <path d="M159 301 H340 L323 437 H177 Z" fill="#b47755"/>
    <ellipse cx="250" cy="301" rx="91" ry="19" fill="#79583c"/>
    <path d="M276 255 L262 331" stroke="#658776" stroke-width="11" stroke-linecap="round"/>
    <text x="120" y="488" font-size="26" font-weight="700">1. Sous la surface</text>
    <text x="120" y="520" font-size="20" fill="#557065">Contrôler l’humidité</text>
    <path d="M503 305 H697 L677 439 H523 Z" fill="#9cb6a9"/>
    <path d="M519 361 H682 L677 426 H527 Z" fill="#76b7c9"/>
    <path d="M531 291 H667 L653 386 H545 Z" fill="#b47755"/>
    <ellipse cx="600" cy="291" rx="68" ry="16" fill="#79583c"/>
    <text x="468" y="488" font-size="26" font-weight="700">2. Eau retenue</text>
    <text x="468" y="520" font-size="20" fill="#557065">Vider le cache-pot</text>
    <path d="M876 301 H1025 L1009 407 H892 Z" fill="#b47755"/>
    <ellipse cx="950" cy="301" rx="75" ry="18" fill="#79583c"/>
    <rect x="901" y="407" width="23" height="28" rx="4" fill="#658776"/>
    <rect x="980" y="407" width="23" height="28" rx="4" fill="#658776"/>
    <path d="M946 413 V430 M962 414 V438" stroke="#4695aa" stroke-width="5" stroke-linecap="round"/>
    <path d="M860 445 H1040" stroke="#c3d4cd" stroke-width="6"/>
    <text x="818" y="488" font-size="26" font-weight="700">3. Sorties libres</text>
    <text x="818" y="520" font-size="20" fill="#557065">Laisser l’eau s’égoutter</text>
  </g>
</svg>
